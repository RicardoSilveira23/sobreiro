<!doctype html>
<!-- The source of site/assets/img/og.png, the 1200x630 picture a shared link shows: the top of the
     site in its dark theme, with the lettering, the rule and the intro's sentence. The colours are
     the dark values of --bg and --soft in site/assets/foundation.css and of --sobreiro-text in sobreiro.css.
     After changing the name or the sentence, open this file in a browser window of 1200 by 630 CSS
     pixels at 100% zoom, capture the viewport, and save it over og.png. -->
<meta charset="utf-8">
