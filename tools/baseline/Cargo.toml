[package]
name = "sobreiro-baseline"
description = "Measures a Sobreiro release build from outside, for docs/baseline.md. Not shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sobreiro-baseline"
path = "src/main.rs"

[dependencies]
# Windows' own calls: the taskbar and its windows, a process's memory and processor time, the
# exe's version details, the clock. Already in the build through the shell; only the parts this
# tool calls are asked for.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
