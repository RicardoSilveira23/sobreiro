<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" role="img">
<title>How heavy each release is</title>
<style>text{font-family:Inter,"Segoe UI",system-ui,sans-serif;fill:#1d1447;font-size:13px}.t{font-weight:600;font-size:14px}.r{font-weight:600}.v{font-variant-numeric:tabular-nums}.s{fill:#4d457c}.x{font-weight:600}</style>
<rect width="760" height="262" rx="8" fill="#f6f3ff"/>
<text x="20" y="34" class="t">Private memory</text><text x="20" y="65" class="r">1.0</text><path d="M56 55h150a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4h-150z" fill="#b9adf5"/><text x="218" y="65" class="v">97 MB</text><text x="20" y="91" class="r">1.1</text><path d="M56 81h148a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4h-148z" fill="#6f4df6"/><text x="216" y="91" class="v">96 MB<tspan class="x" dx="8">about the same</tspan></text>
<text x="400" y="34" class="t">Processor time per idle hour</text><text x="400" y="65" class="r">1.0</text><path d="M436 55h150a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4h-150z" fill="#b9adf5"/><text x="598" y="65" class="v">14.9 s</text><text x="400" y="91" class="r">1.1</text><path d="M436 81h17a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4h-17z" fill="#6f4df6"/><text x="465" y="91" class="v">2.0 s<tspan class="x" dx="8">7.5× less</tspan></text>
<text x="20" y="144" class="t">Start to the pill</text><text x="20" y="175" class="r">1.0</text><path d="M56 165h127a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4h-127z" fill="#b9adf5"/><text x="195" y="175" class="v">0.40 s</text><text x="20" y="201" class="r">1.1</text><path d="M56 191h150a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4h-150z" fill="#6f4df6"/><text x="218" y="201" class="v">0.47 s<tspan class="x" dx="8">1.2× slower</tspan></text>
<text x="400" y="144" class="t">Sobreiro.exe</text><text x="400" y="175" class="r">1.0</text><path d="M436 165h150a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4h-150z" fill="#b9adf5"/><text x="598" y="175" class="v">168.9 MB</text><text x="400" y="201" class="r">1.1</text><path d="M436 191h150a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4h-150z" fill="#6f4df6"/><text x="598" y="201" class="v">168.9 MB<tspan class="x" dx="8">about the same</tspan></text>
<text x="20" y="242" class="s">Shorter is lighter. Multiples against 1.0. From docs/baseline.md, Releases.</text>
</svg>
