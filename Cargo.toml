# Sobreiro 2.0: Core, the bridge and the Windows shell in Rust. 1.x, in C#, ships from the
# branch 1.x.
[workspace]
resolver = "3"
members = ["core", "bridge", "shell/windows", "tools/baseline"]
# What a plain `cargo build` builds. The measuring tool is left out: its Windows features would
# otherwise be switched on in the shipped exe's build too.
default-members = ["core", "bridge", "shell/windows"]

[workspace.package]
version = "2.0.2"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
publish = false

# The release build: one small exe. Size before speed, the whole program optimised as one unit,
# no unwinding tables and no symbols.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Rules the compiler and the linter hold every crate to. "deny" stops the build; one file can
# still allow a rule for itself, with the reason beside it.
[workspace.lints.rust]
# Unsafe code only where the shell calls Windows, in files that say so. Core forbids it outright.
unsafe_code = "deny"

[workspace.lints.clippy]
# A panic ends the app: the release build does not unwind. What can fail gives an error back.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Nothing unfinished and no debugging aid gets merged.
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
