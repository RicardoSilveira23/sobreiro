name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Package
        run: ./scripts/package.ps1 -OutputDir dist -Tag $env:GITHUB_REF_NAME

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Join-Path $PWD 'dist\Sobreiro.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "dist\Sobreiro.exe is missing" }
          $tag = $env:GITHUB_REF_NAME
          $ghArgs = @($tag, $exe, '--generate-notes', '--title', "Sobreiro $($tag.Substring(1))")
          if ($tag.Contains('-')) { $ghArgs += '--prerelease' }
          # A 1.x release takes "Latest" only from another 1.x release, never from 2.0 or later.
          $latest = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0) { throw "gh release view failed" }
          if (-not "$latest".StartsWith('v1.')) { $ghArgs += '--latest=false' }
          gh release create @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
