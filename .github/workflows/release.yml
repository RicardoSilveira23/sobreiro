name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test -c Release

      - name: Package
        run: ./scripts/package.ps1 -OutputDir dist -Tag $env:GITHUB_REF_NAME

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Join-Path $PWD 'dist\Sobreiro.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "dist\Sobreiro.exe is missing" }
          $tag = $env:GITHUB_REF_NAME
          $ghArgs = @($tag, $exe, '--generate-notes', '--title', "Sobreiro $($tag.Substring(1))")
          if ($tag.Contains('-')) { $ghArgs += '--prerelease' }
          gh release create @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
