name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The workspace in Cargo.toml at the root. The compiler is the one rust-toolchain.toml pins,
  # and --locked keeps every library at its version in Cargo.lock.
  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install
          cargo --version

      # What the libraries compile to. It changes only when the compiler, a library or a build
      # flag does.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # In the release profile, so the exe the tests take apart is built as the shipped one is.
      # The licence of every library is one of the tests.
      - name: Test
        run: cargo test --release --workspace --locked

      - name: Build
        run: |
          cargo build --release --locked
          Get-Item target/release/Sobreiro.exe, target/release/sobreiro-bridge.exe |
            ForEach-Object { '{0}: {1} bytes' -f $_.Name, $_.Length }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sobreiro-rust-win-x64
          # One file: the exe carries the bridge.
          path: target/release/Sobreiro.exe
          if-no-files-found: error
          retention-days: 14
