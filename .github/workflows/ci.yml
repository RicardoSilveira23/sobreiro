name: CI

on:
  pull_request:
  push:
    branches: [main, 1.x]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Package
        run: |
          ./scripts/package.ps1 -OutputDir dist -KeepBridge
          Get-ChildItem dist -File | ForEach-Object { '{0}: {1} bytes' -f $_.Name, $_.Length }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sobreiro-win-x64
          path: dist/Sobreiro.exe
          if-no-files-found: error
          retention-days: 14

      # Kept on its own so the bridge can be measured: scripts/baseline.ps1 -Exe ... -Bridge ...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sobreiro-bridge-win-x64
          path: dist/sobreiro-bridge.exe
          if-no-files-found: error
          retention-days: 14
