[package]
name = "sobreiro"
description = "Sobreiro's Windows shell: the pill in the taskbar, the flyout and the tray icons."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "Sobreiro"
path = "src/main.rs"

[dependencies]
# The UI toolkit, pinned to one exact version: the pill's window leans on how this version makes
# and shows a window (docs/shell-comparison.md, "B, for 2.0: the pill's three open questions").
# Drawn in software; none of the toolkit's unstable features.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-path",
    "system-tray",
    "accessibility",
    "raw-window-handle-06",
] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
serde_json = "1"
