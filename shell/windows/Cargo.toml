[package]
name = "sobreiro"
description = "Sobreiro's Windows shell: the pill in the taskbar, the flyout and the tray icons."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "Sobreiro"
path = "src/main.rs"

[dependencies]
# The UI toolkit, pinned to one exact version: the pill's window leans on how this version makes
# and shows a window (docs/shell-comparison.md, "B, for 2.0: the pill's three open questions").
# Drawn in software; none of the toolkit's unstable features.
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-path",
    "system-tray",
    "accessibility",
    "raw-window-handle-06",
] }

# The pictures `--pill-pictures` writes.
png = "=0.18.1"
# Core: the pill model and the colours the face is drawn from.
sobreiro-core = { path = "../../core" }
# Spans of time, as Core's schedule of taskbar questions takes them. The same crate and features
# Core is built with; nothing new enters the build.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Windows' own calls, for the pill's window and the taskbar it follows. Already in the build
# through the toolkit; only the parts the shell calls are asked for. UI Automation's interfaces
# need COM, OLE and VARIANT; monitors are in GDI; the notification state is the shell's. The
# theme is read from the registry, the time zone is asked of Windows, and the Copilot CLI's
# sign-in is read from Credential Manager.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
serde_json = "1"
# The born test looks at a window from outside, with Windows' own calls.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
