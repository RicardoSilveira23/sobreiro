[package]
name = "sobreiro-bridge"
description = "The command Claude Code's status line runs: keeps the limits for the tray and prints a status line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The exe keeps the name 1.x gave it: the `statusLine` entry of an installed user points at it.
[[bin]]
name = "sobreiro-bridge"
path = "src/main.rs"

# Everything but the first line of the exe is a library, so the tests can reach it.
[lib]
path = "src/lib.rs"

[dependencies]
sobreiro-core = { path = "../core" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Windows' own functions, for the three things the standard library cannot do: end a process
# together with all it started, wait for a process no longer than a given time, and ask where
# the user's local application data folder is.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
