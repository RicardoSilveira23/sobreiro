# SPIKE (shell candidate B): the tray icon, the pill and the flyout in Rust on a declarative UI toolkit.
# Thrown away after measuring. Not part of the solution, not built by CI.
[package]
name = "sobreiro-spike-b"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
build = "build.rs"

[[bin]]
name = "Sobreiro"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = [
    "std", "compat-1-2", "backend-winit", "renderer-software", "renderer-femtovg",
    "software-renderer-path", "system-tray", "accessibility", "raw-window-handle-06", "unstable-winit-030",
] }
raw-window-handle = "0.6"
sobreiro-core = { path = "core" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi",
    "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Threading",
    "Win32_System_Ole", "Win32_System_Variant",
] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
